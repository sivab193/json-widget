plugins { id 'com.android.application' }

android {
    namespace 'dev.sivab.appnotify'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.sivab.appnotify'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2.0'
    }

    def releaseKeystorePath = System.getenv("APP_NOTIFY_KEYSTORE")
    def releaseKeystorePassword = System.getenv("APP_NOTIFY_KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("APP_NOTIFY_KEY_ALIAS")
    def releaseKeyPassword = System.getenv("APP_NOTIFY_KEY_PASSWORD")

    signingConfigs {
        if (releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug { }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.findByName("release") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
